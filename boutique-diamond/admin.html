<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Administration — DIAMOND</title>
  <link rel="stylesheet" href="styles.css">
  <script src="admin.js" defer></script>
</head>
<body class="admin-page">
  <header class="header"><div class="wrap header-inner"><a class="logo" href="index.html">DIAMOND<span>.</span></a><a href="index.html">← Voir la boutique</a></div></header>
  <main class="wrap admin-wrap"><div class="admin-heading"><span class="eyebrow">Espace privé</span><h1>Administration</h1><p>La clé est conservée uniquement dans cette session de navigateur.</p></div>
    <section class="admin-card"><h2>Connexion</h2><div class="inline-form"><label for="adminKey">Clé administrateur</label><input id="adminKey" type="password" autocomplete="current-password" placeholder="Saisis ta clé secrète"><button class="button" id="saveKey">Se connecter</button><button class="text-button" id="logout" type="button">Effacer la clé</button></div><p id="status" class="status" role="status"></p></section>
    <section class="admin-card"><h2>Réglages de la boutique</h2><div class="form-grid"><label>Nom de la boutique<input id="brandInput" maxlength="80" placeholder="DIAMOND"></label><label>Numéro WhatsApp avec indicatif<input id="whatsappInput" inputmode="tel" placeholder="Ex. 2126XXXXXXXX"></label><label>URL de l’image principale<input id="heroImageInput" type="url" placeholder="https://…"></label><label>URL de la vidéo principale (facultatif)<input id="heroVideoInput" type="url" placeholder="https://…"></label></div><button class="button" id="saveSettings">Enregistrer les réglages</button></section>
    <section class="admin-card"><h2 id="productFormTitle">Ajouter un produit</h2><form id="productForm"><input id="productId" type="hidden"><div class="form-grid"><label>Nom<input id="productName" required maxlength="120"></label><label>Prix<input id="productPrice" type="number" min="0" step="1" required></label><label class="wide">Description<textarea id="productDescription" rows="3" maxlength="1000"></textarea></label><label>Tailles / options<input id="productSizes" placeholder="S, M, L, XL"></label><label>URL de l’image<input id="productImage" type="url" placeholder="https://…"></label><label class="wide">URL de vidéo (facultatif)<input id="productVideo" type="url" placeholder="https://…"></label></div><div class="actions"><button class="button" type="submit">Enregistrer le produit</button><button class="button button-quiet" type="reset" id="cancelEdit">Effacer le formulaire</button></div></form></section>
    <section class="admin-card"><h2>Produits en boutique</h2><div id="adminProducts"><p class="notice">Connecte-toi avec ta clé pour charger les produits.</p></div></section>
    <input id="productPhotoPicker" type="file" accept="image/*" hidden>
  </main>
</body>
</html>
